<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>Prefill by Civitai URL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <style>
      html * {
	  font-family: "Noto Sans JP", sans-serif;
	  font-optical-sizing: auto;
	  font-style: normal;
      }
      a, a:hover, a:visited, a:active {
	  color: inherit;
	  text-decoration: none;
      }
    </style>
    <script>
      function initSubmitUrlForm(urlForm, versionForm) {
          urlForm.onsubmit = () => {
              (async () => {
                  const formData = new FormData(urlForm);
                  const civitaiUrl = formData.get("url");
                  const modelId = (() => {
                      const url = new URL(civitaiUrl);
                      const pathname = url.pathname;
                      if (!pathname.startsWith("/models/")) return null;
                      const modelIdStr0 = pathname.substring(8);
                      const modelIdStr1 = (() => {
                          const index = modelIdStr0.indexOf("/");
                          if (index === -1) return modelIdStr0;
                          else return modelIdStr0.substring(0, index);
                      })();
                      return parseInt(modelIdStr1);
                  })();
                  const apiUrl = new URL(`/api/prefill/${modelId}/version`, location.origin);
                  const resp = await fetch(apiUrl);
                  if (!resp.ok) {
                      alert("failed to get model version data");
                      return;
                  }

                  const versions = await resp.json();
                  const modelIdInput = versionForm.querySelector("#modelid-input");
                  modelIdInput.value = modelId;
                  for (const [index, version] of versions.entries()) {
                      const inputVersionCheck = document.createElement("input");
                      inputVersionCheck.name = `check-${index}`;
                      inputVersionCheck.type = "checkbox";
                      inputVersionCheck.checked = true;

                      const inputVersionName = document.createElement("input");
                      inputVersionName.name = `name-${index}`;
                      inputVersionName.type = "text";
                      inputVersionName.value = version;
                      inputVersionName.readOnly = true;

                      versionForm.appendChild(inputVersionCheck);
                      versionForm.appendChild(inputVersionName);
                      versionForm.appendChild(document.createElement("br"));
                  }
                  const submit = document.createElement("input");
                  submit.type = "submit";
                  submit.value = "Submit";
                  versionForm.appendChild(submit);
              })();

              return false;
          };
          versionForm.onsubmit = () => {
              const formData = new FormData(versionForm);
              const formDataC = new FormData();
              const names = [];
              const checks = [];
              const modelId = parseInt(formData.get("modelId"));
              for (const [key, value] of formData.entries()) {
                  if (key.startsWith("name-")) names[parseInt(key.replace("name-", ""))] = value;
                  if (key.startsWith("check-")) checks[parseInt(key.replace("check-", ""))] = value === "on";
              }
              const checkedVersions = checks.map((check, index) => [check, names[index]])
                    .filter(([check]) => check)
                    .map(([, name]) => name);
              formDataC.set("versions", JSON.stringify(checkedVersions));
              const xhr = new XMLHttpRequest();
              xhr.open("POST", `/api/prefill/${modelId}`);
              xhr.send(formDataC);
              xhr.onreadystatechange = () => {
                  if (xhr.readyState == XMLHttpRequest.DONE) {
                      if (xhr.status >= 200 && xhr.status < 300) {
                          alert("Submitted");
                          form.reset();
                      } else {
                          alert("Failed to submit form");
                      }
                  }
              }
              return false;
          };
      }
    </script>
  </head>
  <body>
    <h1>Prefill by Civitai URL</h1>
    <form id="url-form">
      <label for="url">Civitai URL: </label>
      <input name="url" type="url" value="" placeholder="https://civitai.com/..." required/>
      <input name="submit" type="submit" value="Submit"/>
      <br/>
    </form>
    <form id="version-form">
      <label for="modelId">Model ID: </label>
      <input id="modelid-input" name="modelId" type="number" required/>
      <br/>
    </form>
    <script>
      const urlForm = document.querySelector("#url-form");
      const versionForm = document.querySelector("#version-form");
      initSubmitUrlForm(urlForm, versionForm);
    </script>
  </body>
</html>
