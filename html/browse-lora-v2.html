<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browse LoRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    html * {
      font-family: "Noto Sans JP", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;
    }
    a, a:hover, a:visited, a:active {
      color: inherit;
      text-decoration: none;
    }
    #browse-control-div {
      position: fixed;
      bottom: 0px;
      margin-left: 30px;
      margin-bottom: 35px;
      background-color: #ccc;
      padding: 20px;
    }
    img {
        height: 35em;
    }
  </style>
  <script>
    function addCatalogEntry(div, loraId, name, version, sampleType) {
      const loraPageElem = document.createElement("a");
      loraPageElem.className = "lora-link";
      loraPageElem.href = new URL(`/v2/lora/${loraId}`, location.origin);
      loraPageElem.textContent = `${name} - ${version}`;
      const titleElem = document.createElement("h2");
      titleElem.appendChild(loraPageElem);
      div.appendChild(titleElem);

      const entryDiv = document.createElement("div");
      entryDiv.style = "display: flex; justify-content: center;";

      const civitaiPreview = document.createElement("img");
      // civitaiPreview.style = "width: 70%; height: 70%;";
      const civitaiPreviewUrl = new URL(`/api/v2/lora/${loraId}/preview/1`, location.origin);
      civitaiPreview.src = civitaiPreviewUrl;
      entryDiv.appendChild(civitaiPreview);

      const loraPreview = document.createElement("img");
      // loraPreview.style = "width: 35%; height: 35%";
      const loraPreviewUrl = new URL(`/api/v2/lora/${loraId}/sampleImage/default/${sampleType}`, location.origin);
      loraPreview.src = loraPreviewUrl;
      entryDiv.appendChild(loraPreview);

      div.appendChild(entryDiv);
    }

    function gotoPage(targetPage, sampleType) {
      const targetUrl = new URL(location.href);
      targetUrl.searchParams.set('page', targetPage.toString());
      targetUrl.searchParams.set('sampleType', sampleType);
      location.href = targetUrl;
    }
  </script>
</head>
<body>
  <div id="browse-control-div">
    <a href="/">[Top]</a><br>
    <input id="browse-lora-page-input" type="number">
    <p id="browse-lora-maxpage-indic" style="display: inline;"></p>
    <button id="browse-lora-gobutton" type="button">Go</button><br>
    <input id="browse-lora-sampletype" type="number">
  </div>
  <div style="width: 100em; max-width: 80%; margin: auto;" id="browse-lora-catalog">
  <h1>Browse LoRA</h1>
  </div>
  <script>
    (async () => {
      const fetchPageUrl = new URL("/api/v2/browse/lora", location.origin);
      const response = await fetch(fetchPageUrl);
      if (!response.ok) {
        alert("failed to fetch page data");
        return;
      }
      const { maxPage } = await response.json();
      const maxPageIndic = document.querySelector("#browse-lora-maxpage-indic");
      const pageInput = document.querySelector("#browse-lora-page-input");
      const sampleTypeInput = document.querySelector("#browse-lora-sampletype");
      const searchParams = new URL(location.href).searchParams;
      const currentPage = parseInt(searchParams.get("page") ?? "0");
      const currentSampleType = parseInt(searchParams.get("sampleType") ?? "1");

      maxPageIndic.textContent = `of ${maxPage}`;
      pageInput.value = currentPage;
      pageInput.style = "width: 100px";
      sampleTypeInput.value = currentSampleType
      sampleTypeInput.style = "width: 100px";

      const goButton = document.querySelector("#browse-lora-gobutton");
      goButton.onclick = () => {
        gotoPage(pageInput.value, sampleTypeInput.value);
      };

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          const target = Math.max(0, currentPage - 1);
          if (currentPage !== target)
            gotoPage(target, currentSampleType);
        } else if (event.key === "ArrowRight") {
          const target = Math.min(maxPage, currentPage + 1);
          if (currentPage !== target)
            gotoPage(target, currentSampleType);
        } else if (event.key === "ArrowUp") {
          gotoPage(currentPage, currentSampleType + 1);
        } else if (event.key === "ArrowDown") {
          const target = Math.max(1, currentSampleType - 1);
          if (currentSampleType !== target)
            gotoPage(currentPage, target);
        }
      })

      const browseResp = await fetch(new URL(`/api/v2/browse/lora/${currentPage}`, location.origin));
      if (!browseResp.ok) {
        alert("failed to fetch browse data");
        return;
      }
      const { loraIds, names, versions } = await browseResp.json();
      const catalogDiv = document.querySelector("#browse-lora-catalog");
      for (let i = 0; i < loraIds.length; i += 1) {
        addCatalogEntry(catalogDiv, loraIds[i], names[i], versions[i], currentSampleType);
      }
    })();
  </script>
</body>
</html>
