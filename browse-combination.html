<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browse LoRA Combinations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    html * {
      font-family: "Noto Sans JP", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;
    }
    a, a:hover, a:visited, a:active {
      color: inherit;
      text-decoration: none;
    }
    #browse-control-div {
      position: fixed;
      bottom: 0px;
      margin-left: 30px;
      margin-bottom: 35px;
      background-color: #ccc;
      padding: 20px;
    }
    .sampleImage {
      width: 50em;
      max-width: 33.33%;
    }
  </style>
  <script>
    function addCatalogRow(div, row, sampleType) {
      const rowDiv = document.createElement("div");
      console.log(row);
      for (const [index, id] of row.entries()) {
        const combinationAnchorElem = document.createElement("a");
        combinationAnchorElem.href = new URL(`/combination/${id}`, location.origin);

        const combinationPreviewImgElem = document.createElement("img");
        combinationPreviewImgElem.className = "sampleImage";
        combinationPreviewImgElem.src = new URL(`/api/combination/${id}/preview/${sampleType}`, location.origin);
        combinationAnchorElem.appendChild(combinationPreviewImgElem);

        rowDiv.appendChild(combinationAnchorElem);
      }
      div.appendChild(rowDiv);
    }

    function gotoPage(targetPage, sampleType) {
      const targetUrl = new URL(location.href);
      targetUrl.searchParams.set('page', targetPage.toString());
      targetUrl.searchParams.set('sampleType', sampleType);
      location.href = targetUrl;
    }
  </script>
</head>
<body>
  <div id="browse-control-div">
    <a href="/">[Top]</a><br>
    <input id="browse-combination-page-input" type="number">
    <p id="browse-combination-maxpage-indic" style="display: inline;"></p>
    <button id="browse-combination-gobutton" type="button">Go</button><br>
    <input id="browse-combination-sampletype" type="number">
  </div>
  <div style="width: 100em; max-width: 80%; margin: auto;" id="browse-combination-catalog">
  <h1>Browse LoRA Combinations</h1>
  </div>
  <script>
    (async () => {
      const fetchPageUrl = new URL("/api/browse/combination", location.origin);
      const response = await fetch(fetchPageUrl);
      if (!response.ok) {
        alert("failed to fetch page data");
        return;
      }
      const { maxPage } = await response.json();
      const maxPageIndic = document.querySelector("#browse-combination-maxpage-indic");
      const pageInput = document.querySelector("#browse-combination-page-input");
      const sampleTypeInput = document.querySelector("#browse-combination-sampletype");
      const searchParams = new URL(location.href).searchParams;
      const currentPage = parseInt(searchParams.get("page") ?? "0");
      const currentSampleType = parseInt(searchParams.get("sampleType") ?? "1");

      maxPageIndic.textContent = `of ${maxPage}`;
      pageInput.value = currentPage;
      pageInput.style = "width: 100px";
      sampleTypeInput.value = currentSampleType
      sampleTypeInput.style = "width: 100px";

      const goButton = document.querySelector("#browse-combination-gobutton");
      goButton.onclick = () => {
        gotoPage(pageInput.value, sampleTypeInput.value);
      };

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          const target = Math.max(0, currentPage - 1);
          if (currentPage !== target)
            gotoPage(target, currentSampleType);
        } else if (event.key === "ArrowRight") {
          const target = Math.min(maxPage, currentPage + 1);
          if (currentPage !== target)
            gotoPage(target, currentSampleType);
        } else if (event.key === "ArrowUp") {
          gotoPage(currentPage, currentSampleType + 1);
        } else if (event.key === "ArrowDown") {
          const target = Math.max(1, currentSampleType - 1);
          if (currentSampleType !== target)
            gotoPage(currentPage, target);
        }
      })

      const browseResp = await fetch(new URL(`/api/browse/combination/${currentPage}`, location.origin));
      if (!browseResp.ok) {
        alert("failed to fetch browse data");
        return;
      }
      const { combinationIds } = await browseResp.json();
      const catalogDiv = document.querySelector("#browse-combination-catalog");

      const columnNum = 3;
      const combinationRows = [];
      for (let i = 0; i < combinationIds.length / columnNum; i += 1) {
        const combinations = [];
        for (let j = i * columnNum; j < Math.min((i + 1) * columnNum, combinationIds.length); j += 1)
          combinations.push(combinationIds[j]);
        combinationRows.push(combinations);
      }

      for (let i = 0; i < combinationRows.length; i += 1) {
        addCatalogRow(catalogDiv, combinationRows[i], currentSampleType);
      }
    })();
  </script>
</body>
</html>
